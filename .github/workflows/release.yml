# Builds Galaxus for Windows, macOS and Linux and publishes the zips as a GitHub release.
#
# Releases are made locally with tools/release.sh, as Mac runners can queue for a long time.
# This workflow is a fallback: run it by hand with a tag name to build on GitHub and publish
# that release. The website links to releases/latest/download/<zip>.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, such as v0.3.0 (leave empty to build without releasing)
        required: false

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    # macOS, so the Mac app can be built and ad hoc signed the same way tools/export.sh does locally.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Godot .NET and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          cd "$RUNNER_TEMP"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q templates.tpz
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          cp -R templates/* "$dest/"
          echo "GODOT=$RUNNER_TEMP/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Check the content and run the tests
        run: tools/validate.sh

      - name: Export
        run: tools/export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: galaxus-builds
          path: build/*.zip
          retention-days: 14

      - name: Publish the release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: build/*.zip
          generate_release_notes: true
